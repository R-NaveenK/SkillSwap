<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SkillSwap</title>
    <link rel="stylesheet" href="../front/front.css">
    <link rel="stylesheet" href="../loginpage/login.css">
</head>
<body class="light-mode" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main);">

<div class="login-wrapper">
    <div class="login-card">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px;">
            <div class="logo-icon">SS</div>
            <span class="logo-text" style="font-size: 26px;">SkillSwap</span>
        </div>

        <h2>Create Account</h2>
        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">Join SkillSwap & claim +100 bonus starting points</p>

        <form id="signupForm" style="display: flex; flex-direction: column; gap: 16px;">
            <input type="text" id="name" class="form-input" placeholder="Full Name" required>
            <input type="email" id="email" class="form-input" placeholder="Email address" required>
            
            <div style="position: relative; width: 100%;">
                <input type="password" id="password" class="form-input" placeholder="Password (min 6 chars)" required minlength="6" style="padding-right: 60px;">
                <button type="button" id="togglePwd" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-secondary);" title="Toggle password visibility">SHOW</button>
            </div>

            <div>
                <label style="font-size: 12px; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">PRIMARY TECHNICAL FOCUS</label>
                <div id="avatarPicker" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                    <button type="button" class="tag avatar-opt active" data-avatar="DEV" style="cursor: pointer; padding: 6px 14px;">Full-Stack</button>
                    <button type="button" class="tag avatar-opt" data-avatar="AI" style="cursor: pointer; padding: 6px 14px;">AI / ML</button>
                    <button type="button" class="tag avatar-opt" data-avatar="SYS" style="cursor: pointer; padding: 6px 14px;">Systems</button>
                    <button type="button" class="tag avatar-opt" data-avatar="UI" style="cursor: pointer; padding: 6px 14px;">UI / UX</button>
                </div>
            </div>

            <button type="submit" class="action-btn" style="padding: 14px; font-size: 15px; margin-top: 8px;">Create Free Account</button>
        </form>

        <p class="signup-text" style="margin-top: 24px; font-size: 14px; color: var(--text-secondary); text-align: center;">
            Already have an account? <a href="../loginpage/login.html" style="color: var(--text-primary); font-weight: 700; text-decoration: underline;">Login</a>
        </p>
    </div>
</div>

<script src="../front/app-state.js"></script>
<script src="signup.js"></script>
</body>
</html>
