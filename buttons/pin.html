<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinned Favorites | SkillSwap</title>
    <link rel="stylesheet" href="../front/front.css">
    <link rel="stylesheet" href="../buttons-css/pin.css">
</head>
<body class="light-mode">

<div class="app">

    <!-- UNIFIED SIDEBAR -->
    <aside class="sidebar">
        <div>
            <a href="../front/front.html" class="logo-container">
                <div class="logo-icon">SS</div>
                <span class="logo-text">SkillSwap</span>
            </a>

            <nav class="nav-menu">
                <a href="../front/front.html" class="nav-item">
                    <span>Dashboard</span>
                </a>
                <a href="courses.html" class="nav-item">
                    <span>Courses</span>
                </a>
                <a href="projects.html" class="nav-item">
                    <span>Projects</span>
                </a>
                <a href="post.html" class="nav-item">
                    <span>Post Skill</span>
                </a>
                <a href="pin.html" class="nav-item active">
                    <span>Bookmarks</span>
                    <span class="nav-badge" id="sidebarPinCount">0</span>
                </a>
                <a href="ai.html" class="nav-item">
                    <span>AI Assistant</span>
                    <span class="nav-badge" style="background: var(--accent-indigo); color: #fff; font-weight: 700;">PRO</span>
                </a>
                <a href="help.html" class="nav-item">
                    <span>Support</span>
                </a>
                <a href="logout.html" class="nav-item">
                    <span>Sign Out</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-user-card">
            <div class="user-avatar" id="userAvatar">N</div>
            <div class="user-info">
                <span class="user-name" id="userName">Naveen</span>
                <span class="user-points-badge"><span id="sidebarPoints">120</span> Pts</span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <header class="topbar">
            <div class="header-title-group">
                <h1>Pinned Hub</h1>
                <p>Access your saved courses, community posts, and technical notes</p>
            </div>

            <div class="topbar-actions">
                <div class="points-pill">
                    <span id="pointsValue">120 Points</span>
                </div>
            </div>
        </header>

        <!-- SEARCH BAR -->
        <div class="search-box" style="margin-bottom: 18px;">
            <input type="text" id="pinSearchInput" class="search-input" placeholder="Search inside your pinned favorites...">
        </div>

        <!-- CATEGORY FILTER BUTTONS -->
        <div class="category-pills" id="pinFilterPills" style="margin-bottom: 28px;">
            <button class="category-pill active" data-filter="all">All Items</button>
            <button class="category-pill" data-filter="note">Notes</button>
            <button class="category-pill" data-filter="course">Courses</button>
            <button class="category-pill" data-filter="post">Custom Posts</button>
        </div>

        <!-- PINNED ITEMS GRID -->
        <div class="grid" id="pinnedGrid">
            <!-- Rendered via JavaScript -->
        </div>

    </main>
</div>

<script src="../front/app-state.js"></script>
<script src="../buttons-js/pin.js"></script>
</body>
</html>
